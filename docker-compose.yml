services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: chatbot, POSTGRES_PASSWORD: chatbot, POSTGRES_DB: chatbot }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U chatbot"], interval: 3s, retries: 20 }
  app:
    build: .
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
volumes:
  pgdata:
